services:
  imdb-ratings:
    image: "ghcr.io/rsivanov-git/lampa-imdb-ratings:${IMAGE_TAG:-latest}"
    container_name: imdb-ratings
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      TMDB_TOKEN: "${TMDB_TOKEN:-}"
      SERVICE_TOKEN: "${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}"
      MINIMUM_RATING_ROWS: "${MINIMUM_RATING_ROWS:-100000}"
      TMDB_MISS_CACHE_HOURS: "${TMDB_MISS_CACHE_HOURS:-1}"
      DATA_DIR: "/data"
    volumes:
      - ./data:/data
