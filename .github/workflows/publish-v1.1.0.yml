name: Publish Docker image v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: Server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v1.1.0
            ghcr.io/${{ github.repository }}:1.1.0
            ghcr.io/${{ github.repository }}:1.1
            ghcr.io/${{ github.repository }}:1
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=Lampa IMDb Ratings
            org.opencontainers.image.description=IMDb ratings service for Lampa
            org.opencontainers.image.version=1.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
